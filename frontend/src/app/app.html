<div class="min-h-screen bg-gray-50 font-sans pb-10">
  
  <nav class="bg-emerald-800 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-400"><path d="M11 20A7 7 0 0 1 14 6h7v7a7 7 0 0 1-7 7H7a7 7 0 0 1 4-14"/></svg>
        <span class="font-bold text-xl">Proyecto Kinuwa Origins</span>
      </div>
      
    </div>
  </nav>

  <main class="mt-8 max-w-4xl mx-auto p-6">
    <div class="animate-fade-in">
      <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Catálogo de Productos</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        @for (prod of inventario(); track prod.id) {
          <div class="bg-white rounded-lg shadow border border-gray-100 overflow-hidden hover:shadow-lg transition-shadow">
            <div class="relative">
              <img [src]="prod.imagen" [alt]="prod.nombre" class="w-full h-48 object-cover" />
              @if (prod.stock !== undefined) {
                <span class="absolute top-2 right-2 bg-white text-xs font-bold px-2 py-1 rounded shadow text-gray-600">
                  Stock: {{ prod.stock }}
                </span>
              }
            </div>
            <div class="p-4 flex flex-col h-[140px]">
              <h3 class="font-bold text-lg text-gray-800">{{ prod.nombre }}</h3>
              <p class="text-sm text-gray-500 mb-2 line-clamp-2">{{ prod.descripcion }}</p>
              <div class="mt-auto">
                <span class="font-bold text-emerald-700 text-xl">S/ {{ prod.precio | number:'1.2-2' }}</span>
              </div>
            </div>
          </div>
        } @empty {
          <div class="col-span-3 text-center py-10 text-gray-500">
            <p>Cargando productos desde la base de datos...</p>
          </div>
        }
        
      </div>
    </div>
  </main>
</div>
